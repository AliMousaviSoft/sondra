version: 2

builds:
  - id: sondra
    main: ./cmd/sondra
    binary: sondra
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: sondra
    builds:
      - sondra
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "sondra_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: yourusername
    name: sondra
  name_template: "sondra {{.Version}}"
  draft: false
  prerelease: auto
